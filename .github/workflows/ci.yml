name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # The hooks and the engine run on the user's machine, so they are tested on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Packaging - marketplace add and plugin install will work
        run: python scripts/verify_install.py

      - name: Consistency - phases, agents, packs, policies and registries agree
        run: python scripts/validate.py

      - name: Engine - routing, scheduler, guards, stacks, ledger, hooks, MCP server
        run: node --test "engine/test/*.test.mjs"
